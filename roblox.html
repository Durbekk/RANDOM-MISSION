<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0b0b12;
    color:white;
    min-height:100vh;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 7%;
    border-bottom:1px solid #252532;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.language{
    display:flex;
    gap:7px;
}

.language button{
    padding:8px 11px;
    border:1px solid #333341;
    border-radius:8px;
    background:#151520;
    color:#aaa;
    cursor:pointer;
}

.language button.active,
.language button:hover{
    background:white;
    color:black;
}

main{
    max-width:950px;
    margin:auto;
    padding:50px 20px;
}

.hero{
    text-align:center;
    margin-bottom:35px;
}

.icon{
    font-size:55px;
    margin-bottom:12px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#999;
}

.modes{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.mode-btn{
    border:1px solid #333341;
    background:#151520;
    color:#aaa;
    border-radius:12px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.mode-btn:hover{
    transform:translateY(-2px);
}

.mode-btn.active{
    background:white;
    color:black;
}

.mode-description{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

.mission-box{
    background:#151520;
    border:1px solid #292936;
    border-radius:20px;
    padding:35px;
    text-align:center;
}

.difficulty{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    background:#242431;
    color:#aaa;
    font-size:12px;
    margin-bottom:15px;
}

.mission-number{
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

.mission{
    font-size:23px;
    line-height:1.5;
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.3s;
}

.buttons{
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.main-btn{
    border:none;
    border-radius:12px;
    padding:13px 24px;
    background:white;
    color:black;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-2px);
    opacity:.9;
}

.back{
    display:block;
    width:fit-content;
    margin:25px auto 0;
    color:#888;
    text-decoration:none;
}

.back:hover{
    color:white;
}

@media(max-width:600px){
    header{
        padding:18px 20px;
    }

    .logo{
        font-size:19px;
    }

    main{
        padding:35px 15px;
    }

    .hero h1{
        font-size:32px;
    }

    .mission{
        font-size:19px;
    }
}

let currentLanguage=
localStorage.getItem("randomMissionLanguage")||"uz";

let difficulty="easy";

let usedMissions={
easy:[],
hard:[],
impossible:[]
};

let missionCounter=0;

function changeLanguage(language){
currentLanguage=language;
localStorage.setItem("randomMissionLanguage",language);
applyLanguage(language);
}

function setDifficulty(mode){

difficulty=mode;

document.querySelectorAll(".mode-btn")
.forEach(btn=>btn.classList.remove("active"));

document.getElementById(mode+"Btn")
.classList.add("active");

const t=translations[currentLanguage];

document.getElementById("modeDescription")
.textContent=t[mode+"Desc"];

document.getElementById("difficultyLabel")
.textContent=t[mode+"Label"];

usedMissions[mode]=[];
missionCounter=0;

document.getElementById("missionNumber")
.textContent=t.number+" #1";

document.getElementById("mission")
.textContent=t.start;
}

function applyLanguage(language){

const t=translations[language];

document.documentElement.lang=language;

document.getElementById("title").textContent=t.title;
document.getElementById("subtitle").textContent=t.subtitle;

document.getElementById("easyBtn").textContent=t.easy;
document.getElementById("hardBtn").textContent=t.hard;
document.getElementById("impossibleBtn").textContent=t.impossible;

document.getElementById("modeDescription")
.textContent=t[difficulty+"Desc"];

document.getElementById("difficultyLabel")
.textContent=t[difficulty+"Label"];

document.getElementById("randomBtn").textContent=t.button;
document.getElementById("back").textContent=t.back;

if(missionCounter===0){

document.getElementById("mission").textContent=t.start;

document.getElementById("missionNumber")
.textContent=t.number+" #1";

}

document.querySelectorAll(".language button")
.forEach(btn=>btn.classList.remove("active"));

document.getElementById(language+"Btn")
.classList.add("active");
}

function randomMission(){

const t=translations[currentLanguage];
const missions=t.missions[difficulty];

if(usedMissions[difficulty].length>=missions.length){
usedMissions[difficulty]=[];
}

const available=missions
.map((_,index)=>index)
.filter(index=>
!usedMissions[difficulty].includes(index)
);

const randomIndex=
available[
Math.floor(Math.random()*available.length)
];

usedMissions[difficulty].push(randomIndex);
missionCounter++;

const missionElement=document.getElementById("mission");

missionElement.style.opacity="0";
missionElement.style.transform="translateY(15px) scale(.98)";

setTimeout(()=>{

missionElement.textContent=missions[randomIndex];

document.getElementById("missionNumber")
.textContent=t.number+" #"+missionCounter;

missionElement.style.opacity="1";
missionElement.style.transform="translateY(0) scale(1)";

},180);
}

applyLanguage(currentLanguage);
