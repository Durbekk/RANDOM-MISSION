    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Mission - Minecraft</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            border-bottom: 1px solid #252532;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .home {
            color: #aaa;
            text-decoration: none;
        }

        .home:hover {
            color: white;
        }

        .languages {
            display: flex;
            gap: 5px;
        }

        .languages button {
            padding: 7px 9px;
            border: 1px solid #333341;
            border-radius: 7px;
            background: #151520;
            color: #aaa;
            cursor: pointer;
        }

        .languages button.active,
        .languages button:hover {
            background: white;
            color: black;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        .title {
            font-size: 44px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
        }

        .modes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .mode {
            background: #151520;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 25px 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mode:hover {
            transform: translateY(-4px);
            border-color: #666;
        }

        .mode.active {
            background: #1d1d2a;
            border-color: white;
        }

        .mode-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .mode h2 {
            margin-bottom: 8px;
        }

        .mode p {
            color: #999;
            font-size: 14px;
        }

        .challenge-box {
            background: #151520;
            border: 1px solid #292936;
            border-radius: 22px;
            padding: 50px 25px;
            min-height: 280px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .mode-label {
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            margin-bottom: 20px;
        }

        #challenge {
            max-width: 780px;
            font-size: 29px;
            font-weight: bold;
            line-height: 1.45;
        }

        #timer {
            display: none;
            margin-top: 22px;
            font-size: 38px;
            font-weight: bold;
        }

        #timer.danger {
            color: #ff5555;
        }

        #timeUp {
            display: none;
            margin-top: 15px;
            color: #ff5555;
            font-size: 22px;
            font-weight: bold;
        }

        .action {
            margin-top: 30px;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .action:hover {
            opacity: 0.85;
        }

        .counter {
            margin-top: 17px;
            color: #666;
            font-size: 13px;
        }

        footer {
            text-align: center;
            color: #666;
            padding: 35px;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            header {
                padding: 18px 15px;
            }

            .logo {
                font-size: 19px;
            }

            .header-right {
                gap: 8px;
            }

            .home {
                font-size: 13px;
            }

            .languages button {
                padding: 6px 7px;
                font-size: 11px;
            }

            .title {
                font-size: 34px;
            }

            .modes {
                grid-template-columns: 1fr;
            }

            #challenge {
                font-size: 22px;
            }
        }
    </style>
</head>

/* =====================================================
   O'ZGARUVCHILAR
===================================================== */

let currentMode = "normal";

let currentLanguage =
    localStorage.getItem("randomMissionLanguage") || "uz";

let currentMission = null;

let timerInterval = null;

let timeLeft = 0;


/* =====================================================
   TASODIFIY TOPSHIRIQ
===================================================== */

function getRandomMission() {

    let missions;

    if (currentMode === "normal") {
        missions = normalMissions;
    }

    else if (currentMode === "speed") {
        missions = speedMissions;
    }

    else {
        missions = hardMissions;
    }

    const randomIndex =
        Math.floor(Math.random() * missions.length);

    currentMission = missions[randomIndex];

    document.getElementById("challenge").textContent =
        currentMission[currentLanguage];

}


/* =====================================================
   TILNI ALMASHTIRISH
===================================================== */

function changeLanguage(language) {

    currentLanguage = language;

    localStorage.setItem(
        "randomMissionLanguage",
        language
    );

    applyLanguage();

}


/* =====================================================
   TILNI QO'LLASH
===================================================== */

function applyLanguage() {

    const t = translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.getElementById("home").textContent =
        t.home;

    document.getElementById("title").textContent =
        t.title;

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("normalTitle").textContent =
        t.normalTitle;

    document.getElementById("normalText").textContent =
        t.normalText;

    document.getElementById("speedTitle").textContent =
        t.speedTitle;

    document.getElementById("speedText").textContent =
        t.speedText;

    document.getElementById("hardTitle").textContent =
        t.hardTitle;

    document.getElementById("hardText").textContent =
        t.hardText;

    document.getElementById("newButton").textContent =
        t.newMission;

    document.getElementById("timeUp").textContent =
        t.timeUp;


    document.getElementById("uzBtn")
        .classList.remove("active");

    document.getElementById("ruBtn")
        .classList.remove("active");

    document.getElementById("enBtn")
        .classList.remove("active");


    document.getElementById(
        currentLanguage + "Btn"
    ).classList.add("active");


    updateModeLabel();

    updateCounter();


    if (currentMission !== null) {

        document.getElementById("challenge").textContent =
            currentMission[currentLanguage];

    }

    updateTimer();

}


/* =====================================================
   REJIM NOMI
===================================================== */

function updateModeLabel() {

    const t = translations[currentLanguage];

    if (currentMode === "normal") {

        document.getElementById("modeLabel").textContent =
            t.normalLabel;

    }

    else if (currentMode === "speed") {

        document.getElementById("modeLabel").textContent =
            t.speedLabel;

    }

    else {

        document.getElementById("modeLabel").textContent =
            t.hardLabel;

    }

}


/* =====================================================
   TOPSHIRIQLAR SONI
===================================================== */

function updateCounter() {

    const t = translations[currentLanguage];

    let amount;

    if (currentMode === "normal") {
        amount = normalMissions.length;
    }

    else if (currentMode === "speed") {
        amount = speedMissions.length;
    }

    else {
        amount = hardMissions.length;
    }

    document.getElementById("counter").textContent =
        amount + " " + t.missionCount;

}


/* =====================================================
   REJIMNI ALMASHTIRISH
===================================================== */

function setMode(mode) {

    currentMode = mode;

    stopTimer();

    document.getElementById("timeUp")
        .style.display = "none";

    document.getElementById("timer")
        .style.display = "none";


    document.getElementById("normalMode")
        .classList.remove("active");

    document.getElementById("speedMode")
        .classList.remove("active");

    document.getElementById("hardMode")
        .classList.remove("active");


    if (mode === "normal") {

        document.getElementById("normalMode")
            .classList.add("active");

    }

    else if (mode === "speed") {

        document.getElementById("speedMode")
            .classList.add("active");

    }

    else {

        document.getElementById("hardMode")
            .classList.add("active");

    }


    updateModeLabel();

    updateCounter();

    newChallenge();

}


/* =====================================================
   YANGI TOPSHIRIQ
===================================================== */

function newChallenge() {

    stopTimer();

    document.getElementById("timeUp")
        .style.display = "none";

    document.getElementById("timer")
        .style.display = "none";

    document.getElementById("timer")
        .classList.remove("danger");


    getRandomMission();


    if (currentMode === "speed") {

        startTimer();

    }

}


/* =====================================================
   TEZKOR REJIM TAYMERI
===================================================== */

function startTimer() {

    const min = 2;
    const max = 30;


    timeLeft =
        Math.floor(
            Math.random() * (max - min + 1)
        ) + min;


    document.getElementById("timer")
        .style.display = "block";


    updateTimer();


    timerInterval =
        setInterval(function() {

            timeLeft--;

            updateTimer();


            if (timeLeft <= 0) {

                stopTimer();

                document.getElementById("timeUp")
                    .style.display = "block";

            }

        }, 60000);

}


/* =====================================================
   TAYMER
===================================================== */

function updateTimer() {

    const timer =
        document.getElementById("timer");

    if (currentMode !== "speed") {
        return;
    }


    const t =
        translations[currentLanguage];


    timer.textContent =
        timeLeft + " " + t.minute;


    if (timeLeft <= 1) {

        timer.classList.add("danger");

    }

    else {

        timer.classList.remove("danger");

    }

}


/* =====================================================
   TAYMERNI TO'XTATISH
===================================================== */

function stopTimer() {

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


/* =====================================================
   BOSHLANG'ICH ISHGA TUSHIRISH
===================================================== */

applyLanguage();

newChallenge();
