<title>Dasturlash — Random Mission</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
    min-height: 100vh;
}

header {
    background: #111827;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #263043;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.home {
    color: white;
    text-decoration: none;
    background: #1f2937;
    padding: 9px 14px;
    border-radius: 9px;
}

.languages {
    display: flex;
    gap: 6px;
}

.lang {
    border: none;
    padding: 8px 11px;
    border-radius: 8px;
    cursor: pointer;
    background: #1f2937;
    color: white;
    font-weight: bold;
}

.lang.active {
    background: #2563eb;
}

main {
    width: min(950px, 94%);
    margin: 40px auto;
    text-align: center;
}

h1 {
    font-size: 36px;
    margin-bottom: 10px;
}

.subtitle {
    color: #9ca3af;
    margin-bottom: 30px;
}

.modes {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
}

.mode {
    border: none;
    padding: 13px 25px;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    background: #1f2937;
    font-size: 16px;
    font-weight: bold;
}

.mode.active {
    background: #2563eb;
}

.mission-box {
    background: #111827;
    border: 1px solid #263043;
    border-radius: 18px;
    padding: 35px 25px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.mode-name {
    color: #60a5fa;
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 18px;
}

.mission {
    font-size: 23px;
    line-height: 1.5;
    max-width: 820px;
    margin-bottom: 25px;
}

.new-btn {
    border: none;
    background: #16a34a;
    color: white;
    padding: 13px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.new-btn:hover {
    background: #15803d;
}

.counter {
    margin-top: 18px;
    color: #9ca3af;
}

@media (max-width: 600px) {
    h1 {
        font-size: 28px;
    }

    .mission {
        font-size: 19px;
    }

    .modes {
        flex-wrap: wrap;
    }

    .mode {
        padding: 11px 18px;
    }
}
</style>
</head>

let language =
    localStorage.getItem("randomMissionLanguage") || "uz";

let mode = "normal";
let completed = 0;


/* =========================
   TIL
========================= */

function changeLanguage(lang) {

    language = lang;

    localStorage.setItem(
        "randomMissionLanguage",
        lang
    );

    document.querySelectorAll(".lang").forEach(btn => {
        btn.classList.remove("active");
    });

    document
        .querySelector(
            `.lang[onclick="changeLanguage('${lang}')"]`
        )
        .classList.add("active");

    updateInterface();
}


/* =========================
   INTERFEYS
========================= */

function updateInterface() {

    const t = translations[language];

    document.getElementById("homeBtn").textContent =
        t.home;

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("normalBtn").textContent =
        t.normal;

    document.getElementById("hardBtn").textContent =
        t.hard;

    document.getElementById("newBtn").textContent =
        t.newMission;

    document.getElementById("modeName").textContent =
        mode === "normal"
            ? t.normalMission
            : t.hardMission;

    document.getElementById("counterText").textContent =
        t.counter + completed;
}


/* =========================
   REJIM
========================= */

function setMode(selectedMode) {

    mode = selectedMode;

    document
        .getElementById("normalBtn")
        .classList.toggle(
            "active",
            mode === "normal"
        );

    document
        .getElementById("hardBtn")
        .classList.toggle(
            "active",
            mode === "hard"
        );

    completed = 0;

    updateInterface();

    newChallenge();
}


/* =========================
   TASODIFIY TOPSHIRIQ
========================= */

function newChallenge() {

    const missions =
        mode === "normal"
            ? normalMissions
            : hardMissions;

    const randomIndex =
        Math.floor(
            Math.random() * missions.length
        );

    const mission =
        missions[randomIndex];

    document.getElementById("mission").textContent =
        mission[language];

    completed++;

    const t = translations[language];

    document.getElementById("counterText").textContent =
        t.counter + completed;
}


/* =========================
   BOSHLANISH
========================= */

updateInterface();
newChallenge();
